<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Vuelos | Vuelos en Tiempo Real</title>
    <!-- Usando Google Fonts (Inter es muy similar a Google Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Encabezado Estilo Google Flights -->
        <header class="header">
            <div class="header-logo">
                <svg viewBox="0 0 24 24" class="plane-icon" fill="currentColor">
                    <path d="M22 16v-2l-8.5-5V3.5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5V9L2 14v2l8.5-2.5V19L8 20.5V22l4-1 4 1v-1.5L13.5 19v-5.5L22 16z"></path>
                </svg>
                <h1>Vuelos</h1>
            </div>
            
            <div class="header-actions">
                <button id="btn-refresh" class="btn-refresh">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"></path>
                    </svg>
                    <span>Actualizar precios</span>
                </button>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="main-content">
            <div class="hero-section">
                <h2>Rutas en seguimiento</h2>
                <p>Monitoreo inteligente de precios basado en el mercado aéreo</p>
            </div>

            <!-- Tabla de Vuelos -->
            <div class="table-container">
                <table class="flights-table" id="flights-table">
                    <thead>
                        <tr>
                            <th>Ruta</th>
                            <th>Precio actual</th>
                            <th>Precio promedio</th>
                            <th>Estado</th>
                            <th>Señal</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- El estado inicial de carga -->
                        <tr id="loading-row">
                            <td colspan="5" class="status-message">
                                <div class="spinner"></div>
                                <span>Cargando vuelos...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Contenedor para mostrar mensajes de Error -->
            <div id="error-container" class="error-container hidden">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="#d93025">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path>
                </svg>
                <h3 id="error-title">No se pudieron cargar los precios</h3>
                <p id="error-message">Hubo un problema al conectar con el servidor.</p>
                <button id="btn-retry" class="btn-refresh" style="margin-top: 16px;">Reintentar</button>
            </div>

        </main>
    </div>

    <!-- Template base para filas (oculto en HTML) -->
    <template id="row-template">
        <tr class="flight-row">
            <td class="col-ruta">
                <div class="ruta-badge"></div>
            </td>
            <td class="col-precio current-price"></td>
            <td class="col-promedio average-price"></td>
            <td class="col-estado">
                <span class="badge-estado"></span>
            </td>
            <td class="col-senal">
                <span class="badge-senal"></span>
            </td>
        </tr>
    </template>

    <script src="app.js"></script>
</body>
</html>
